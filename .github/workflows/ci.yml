# 동행 v1 · CI (D11 — Phase 1 Day 2b)
#
# 트리거: PR + main push
# 검증: bun install → turbo lint/typecheck (Day 2b 시점)
# 추가 예정: turbo test (Day 3 Scaffold + Phase 4부터)
#         · docker build smoke (선택)
#         · Turbo Remote Cache (Vercel token 등록 후)

name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치/PR의 이전 run 자동 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup Node (Biome + tsc binaries)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck (turbo)
        run: bun run typecheck

  docker-smoke:
    name: Docker build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image (cache only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/server/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          tags: trip-server:ci

      - name: Build ai-tts image (cache only)
        uses: docker/build-push-action@v5
        with:
          context: backend/ai-tts
          push: false
          load: false
          cache-from: type=gha,scope=tts
          cache-to: type=gha,mode=max,scope=tts
          tags: trip-tts:ci
