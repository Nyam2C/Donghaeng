<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>동행 · Donghaeng</title>

    <!--
      Expo Web 의 google fonts 로딩 (design-preview.html 과 동일 패턴)
      RN-web 의 fontFamily → CSS font-family 매핑.
      theme/fonts.family 토큰 키 (NotoSerifKR, Fraunces-Italic, DMMono, Pretendard)
      에 google fonts 의 정식 family name 을 alias 로 매핑.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />

    <style>
      /* theme/fonts.family 토큰 키 → google fonts family alias */
      @font-face {
        font-family: 'NotoSerifKR';
        src: local('Noto Serif KR'), local('NotoSerifKR');
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Fraunces-Italic';
        src: local('Fraunces');
        font-weight: 400 500;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'DMMono';
        src: local('DM Mono'), local('DMMono');
        font-weight: 400 500;
        font-style: normal;
        font-display: swap;
      }
      /* Pretendard 는 jsdelivr CSS 가 이미 family-name 'Pretendard Variable' / 'Pretendard' 등록 */
      @font-face {
        font-family: 'Pretendard';
        src: local('Pretendard Variable'), local('Pretendard');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript>JavaScript 를 켜면 동행이 함께합니다.</noscript>
    <div id="root"></div>
  </body>
</html>
